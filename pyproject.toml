[project]
name = "market-data-tick-adapter"
version = "0.2.0"
description = "Expose ELTDX market data with AkShare fallback through Tick Stock Panel endpoints"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.18.81,<2",
  "eltdx[http]",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
market-data-tick-adapter = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
